# The gate. Ordered fail-fast: the cheapest checks that catch the most run first.
#
# `--locked` on every cargo invocation, because Cargo.lock is committed here on
# purpose. This is firmware-shaped software and the bytes that were tested are
# the bytes that go on a device, so a dependency resolving differently in CI
# than on disk is a failure and not a convenience.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # The example is the README. A snippet that does not compile is worse
      # than no snippet, so it is built rather than trusted.
      - name: Examples build
        run: cargo build --locked --examples

      - name: Tests
        run: cargo test --locked

  # Windows, compiled from Linux the way builder/Dockerfile compiles it: the
  # same mingw-w64 variant, and NASM for aws-lc-sys. Checking does not link,
  # and the linker is the half of a cross build that fails, so every test
  # binary and example is built as well as linted.
  windows-gnu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Lint
        run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets --all-features -- -D warnings

      - name: Link
        run: cargo test --locked --target x86_64-pc-windows-gnu --all-features --no-run

  # Natively, because what Windows does to a running .exe and what its service
  # manager does with an exit 73 are behaviours rather than types, and only
  # Windows has them. The toolchain here is the runner's own, MSVC, rather
  # than the gnu target the builder ships: the code under test is the same,
  # and the gnu link is the job above.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    env:
      # aws-lc-sys assembles NASM sources on x86-64 Windows. With NASM on the
      # runner it uses it; without, this lets it use the same sources
      # assembled upstream. The builder image assembles them itself.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Tests
        run: cargo test --locked --all-features

      # Registers a real service, starts it, and proves that exit 73 and a
      # stop with an error both restart it. A step of its own so a failure
      # names the claim that broke. It needs an elevated runner, which this is.
      - name: Service manager
        env:
          OPENQTT_SCM_TEST: "1"
        run: cargo test --locked --all-features --test service_manager

  # Natively, on Apple silicon, because what launchd does with an exit 73 and
  # what the kernel does with a binary an update renamed into place are
  # behaviours rather than types. Intel is compiled from the same runner:
  # Apple's toolchain builds both, and nothing in the crate differs by arch.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The Linux job never compiles what is behind cfg(target_os = "macos").
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      # Loads the README's plist into launchd as a real LaunchDaemon, and
      # proves that exit 73, exit 0 and an exit after a long run all start it
      # again. A step of its own so a failure names the claim that broke. It
      # needs root, and sudo on this runner asks for no password.
      - name: launchd
        env:
          OPENQTT_LAUNCHD_TEST: "1"
        run: cargo test --locked --test launchd

      - name: Intel
        run: cargo check --locked --target x86_64-apple-darwin --all-targets --all-features

  # The house-wide copy rule, gated rather than remembered.
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No em dashes in prose
        run: |
          if grep -rn $'—' --include="*.md" .; then
            echo "Em dashes are not used in SCADABLE copy."
            exit 1
          fi
